<style>

.fld{width:100%;padding:13px 15px;border-radius:16px;border:1.5px solid var(--ln);background:var(--sf);margin:6px 0 14px}label{font-weight:700;font-size:13px;display:block}
.pb{display:block;width:100%;text-align:center;text-decoration:none;background:var(--pri);color:var(--on);font-weight:800;padding:15px;border-radius:18px;margin-top:14px}
.sb{display:block;width:100%;border:1.5px solid var(--ln);border-radius:18px;padding:13px;font-weight:800;background:var(--sf);text-align:center;text-decoration:none;color:var(--ink)}
.rb{display:grid;grid-template-columns:86px 1fr auto;gap:10px;align-items:center;padding:6px 0;font-size:14px;font-weight:600}.rb .b{height:14px;border-radius:7px;background:var(--tint)}.rb .b b{display:block;height:100%;border-radius:7px;background:color-mix(in srgb,var(--pri) 35%,var(--sf))}.rb .b b.top{background:var(--pri)}
.pr{height:8px;border-radius:5px;background:var(--tint);margin:7px 0 2px;overflow:hidden}.pr b{display:block;height:100%;background:var(--ok)}
.logo{font-weight:800;font-size:24px;letter-spacing:-.8px}.logo b{color:var(--pri);border-bottom:3px dashed var(--pri)}

nav .add{margin-top:-24px;color:var(--mut)}nav .add span{width:58px;height:58px;border-radius:50%;background:var(--pri);color:var(--on);display:grid;place-items:center;box-shadow:0 8px 20px -6px var(--pri);border:5px solid var(--bg)}
.ov{position:absolute;inset:0;background:#0009;z-index:5}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--sf);border-radius:30px 30px 0 0;padding:14px 16px 18px;z-index:6;max-height:95%;overflow-y:auto;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}}@media (prefers-reduced-motion:reduce){.sheet,.pg b{animation:none;transition:none}}
.amt{font-size:44px;font-weight:800;letter-spacing:-1.8px;margin-top:12px;line-height:1.1}.amt small{font-size:20px;color:var(--mut);margin-right:5px;letter-spacing:0}
.err{color:var(--bad);font-size:13px;font-weight:700;min-height:20px}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:8px}.kp button{height:46px;border-radius:15px;background:var(--bg);font-size:20px;font-weight:800}.kp button:active{background:var(--tint)}
.dlg{position:absolute;left:18px;right:18px;top:50%;transform:translateY(-50%);background:var(--sf);border-radius:26px;padding:22px;z-index:8}
#toast{position:absolute;left:14px;right:14px;bottom:96px;background:var(--ink);color:var(--sf);padding:12px 16px;border-radius:18px;opacity:0;transform:translateY(14px);transition:.25s;pointer-events:none;z-index:9;display:flex;justify-content:space-between;gap:10px;font-weight:600;font-size:14px}
#toast.show{opacity:1;transform:none;pointer-events:auto}#toast button{color:var(--hl);font-weight:800}
</style>
